openapi: 3.0.0
info:
  title: Simple dashboard for PostgreSQL
  version: 0.0.1
  description: Collection of all available REST handlers
servers:
  - url: http://localhost:8001/api
tags:
  - name: cluster
    description: Everything related to Postgres cluster level settings and objects
  - name: database
    description: Everything related to Postgres database level settings and objects
  - name: role
    description: Everything related to Postgres role level settings and objects
  - name: metrics
    description: Everything related to metric collection, history and streaming
paths:
  /cluster/status:
    get:
      tags:
        - cluster
      summary: Get server current status
      operationId: GetStatus
      responses:
        "200":
          description: Server current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetStatusResponse"
              examples:
                success:
                  summary: Status received successfully
                  value:
                    user: postgres
                    database: postgres
                    connectionStatus: connected
                connection lost:
                  summary: Status with lost connection
                  value:
                    connectionStatus: disconnected
        "400":
          description: Request server status failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBase"
  /cluster/switch-current-database:
    post:
      tags:
        - cluster
      summary: Set new current database
      description: Switching the database connection allows access to pg_class.
      operationId: SwitchCurrentDatabase
      requestBody:
        required: true
        description: Request's data payload
        content:
          application/json:
            schema:
              type: object
              required:
                - databaseId
              properties:
                databaseId:
                  type: integer
                  example: 5
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetStatusResponse"
        "400":
          description: Connection attempt failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBase"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBase"
  /cluster/connect:
    post:
      tags:
        - cluster
      summary: Connect to Postgres cluster
      description: Connect to Postgres cluster
      operationId: ClusterConnect
      requestBody:
        required: true
        description: Request's data payload
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterConnectData"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetStatusResponse"
        "422":
          description: Request data invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "400":
          description: Connection attempt failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBase"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBase"
  /cluster/disconnect:
    post:
      tags:
        - cluster
      summary: Disconnect from Postgres cluster
      description: Disconnect from Postgres cluster
      operationId: ClusterDisconnect
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetStatusResponse"
        "400":
          description: Disconnection attempt failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBase"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBase"
  /cluster/version:
    get:
      tags:
        - cluster
      summary: Get detailed Postgres version info
      description: Get detailed Postgres version info
      operationId: PostgresVersion
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPostgresVersionResponse"
        "400":
          description: Attempt failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBase"
  /cluster/uptime:
    get:
      tags:
        - cluster
      summary: Get Postgres uptime info
      description: Get Postgres uptime info
      operationId: PostgresUptime
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPostgresUptimeResponse"
        "400":
          description: Attempt failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBase"
  /cluster/postmaster-settings:
    get:
      tags:
        - cluster
      summary: Get global cluster settings
      description: Returns some settings from pg_settings in the "postmaster" context.
      operationId: PostmasterSettings
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/GetPostgresPostmasterSettings"
                example:
                  configFile:
                    name: config_file
                    value: /Library/PostgreSQL/16/data/postgresql.conf
                    unit: ""
                    description: Sets the server's main configuration file
                  dataDirectory:
                    name: data_directory
                    value: /Library/PostgreSQL/16/data
                    unit: ""
                    description: Sets the server's data directory.
                  sharedBuffers:
                    name: shared_buffers
                    value: 256 MB
                    unit: 8kB
                    description: Sets the number of shared memory buffers used by the server.
                  walBuffers:
                    name: wal_buffers
                    value: 8 MB
                    unit: 8kB
                    description: Sets the number of disk-page buffers in shared memory for WAL.
                  maxConnections:
                    name: max_connections
                    value: "100"
                    unit: ""
                    description: Sets the maximum number of concurrent connections.
                  hbaFile:
                    name: hba_file
                    value: /Library/PostgreSQL/16/data/pg_hba.conf
                    unit: ""
                    description: Sets the server's "hba" configuration file.
                  walLevel:
                    name: wal_level
                    value: replica
                    unit: ""
                    description: Sets the level of information written to the WAL.
                  autovacuumMaxWorkers:
                    name: autovacuum_max_workers
                    value: "4"
                    unit: ""
                    description:
                      Sets the maximum number of simultaneously running autovacuum worker
                      processes.
        "400":
          description: Attempt failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBase"
  /cluster/roles:
    get:
      tags:
        - role
      summary: Get available roles
      description: Returns a list of all available roles with their details
      operationId: Roles
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleView"
        "400":
          description: Attempt failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBase"
  /database/{databaseId}:
    get:
      tags:
        - database
      summary: Find database by identifier
      description: Returns a single database
      operationId: Database
      parameters:
        - name: databaseId
          in: path
          description: ID of database to return
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Database"
        "400":
          description: Attempt to get database failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBase"
        "404":
          description: Database not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBase"
  /database/{databaseId}/stats/overview:
    get:
      tags:
        - database
      summary: Get static stats for database size, tables, indexes
      description: Returns static stats for database
      operationId: DatabaseStatsOverview
      parameters:
        - name: databaseId
          in: path
          description: ID of database to return
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseStatsOverview"
        "400":
          description: Failed attempt to get database stats overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBase"
        "404":
          description: Database not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBase"
  /databases-detailed:
    get:
      tags:
        - database
      summary: Get all databases
      description: Returns a list of all available databases with their details
      operationId: DatabasesDetailed
      parameters:
        - name: sort
          description: Field to sort by
          in: query
          required: false
          schema:
            type: string
            enum: [size, connection]
          x-oapi-codegen-extra-tags:
            validate: "omitempty,oneof=size connection"
        - name: order
          description: Sort direction
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
          x-oapi-codegen-extra-tags:
            validate: "omitempty,oneof=asc desc"
          # default: desc
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DatabaseDetails"
        "400":
          description: Attempt failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBase"
        "422":
          description: Some query params are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
  /metrics/history:
    get:
      tags:
        - metrics
      summary: Get metric history
      description: >
        Returns stored points of the requested metrics. Live values arrive from
        the SSE stream (`GET /api/metrics/stream`), this endpoint provides the
        initial series and repairs gaps after a reconnect. To avoid gaps and
        duplicates, fetch the history up to the moment of subscribing and apply
        incoming live samples only when their timestamp is newer than the last
        stored point.
      operationId: MetricsHistory
      parameters:
        - name: names
          in: query
          required: false
          description: Comma separated metric names. All known metrics when omitted.
          schema:
            type: string
          example: buffer_cache_hit,connections
        - name: from
          in: query
          required: false
          description: Start of the range (RFC3339). Defaults to the retention window.
          schema:
            type: string
            format: date-time
          example: "2026-10-11T18:00:00Z"
        - name: to
          in: query
          required: false
          description: End of the range (RFC3339). Defaults to now.
          schema:
            type: string
            format: date-time
          example: "2026-10-11T18:30:00Z"
        - name: limit
          in: query
          required: false
          description: Maximum number of points per metric. The newest points win.
          schema:
            type: integer
          example: 600
      responses:
        "200":
          description: Metric history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsHistory"
              example:
                series:
                  buffer_cache_hit:
                    - timestamp: "2026-10-11T18:00:01Z"
                      value: 98.4
                  connections:
                    - timestamp: "2026-10-11T18:00:00Z"
                      value: 26
        "400":
          description: Attempt to get metric history failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBase"
components:
  schemas:
    MetricPoint:
      type: object
      description: Single history point of a metric
      x-go-type: metricsEntities.SeriesPoint
      x-go-type-import:
        path: dashboard/api/internal/model/metrics
        name: metricsEntities
      x-go-type-name: metricsEntities.SeriesPoint
      required:
        - timestamp
        - value
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-10-11T18:00:01Z"
        value:
          type: number
          description: Integer metrics keep their integer representation
          example: 98.4
    MetricsHistory:
      type: object
      description: History series of the requested metrics keyed by metric name
      x-go-type: metricsEntities.History
      x-go-type-import:
        path: dashboard/api/internal/model/metrics
        name: metricsEntities
      x-go-type-name: metricsEntities.History
      required:
        - series
      example:
        series:
          buffer_cache_hit:
            - timestamp: "2026-10-11T18:00:01Z"
              value: 98.4
      properties:
        series:
          type: object
          description: Points per metric name, ordered by timestamp
          example:
            connections:
              - timestamp: "2026-10-11T18:00:00Z"
                value: 26
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/MetricPoint"
    ErrorBase:
      type: object
      description: Error part that should be present in all errors
      required:
        - message
      properties:
        message:
          type: string
          example: something went wrong
    RequestValidationError:
      allOf:
        - $ref: "#/components/schemas/ErrorBase"
        - type: object
          properties:
            reason:
              type: string
              example: the body fields are invalid
          required:
            - reason
    TrendDirection:
      type: string
      description: Represents trend direction state in stats
      example: up
      enum: [up, down]
      x-enum-varnames:
        - StatDirectionUp,
        - StatDirectionDown,
    ConnectionStatus:
      type: string
      description: Represents connection state between dashboard and postgres
      example: connected
      enum: [connecting, connected, disconnected, error]
      x-enum-varnames:
        - PgConnectionStatusConnecting,
        - PgConnectionStatusConnected,
        - PgConnectionStatusDisconnected,
        - PgConnectionStatusError,
    PostgresSetting:
      type: object
      description: Represents some columns from "pg_catalog.pg_settings"
      x-go-type: clusterEntities.Setting
      x-go-type-import:
        path: dashboard/api/internal/model/cluster
        name: Setting
      x-go-type-name: clusterEntities.Setting
      required:
        - name
        - value
        - unit
        - description
      properties:
        name:
          type: string
          example: shared_buffers
        value:
          type: string
          example: "32768"
        unit:
          type: string
          example: 8kB
        description:
          type: string
          example: Sets the number of...
    DatabaseStatsOverview:
      type: object
      description: Represents database stats overview
      x-go-type: databaseEntities.DatabaseStatsOverview
      x-go-type-import:
        path: dashboard/api/internal/model/database
        name: databaseEntities
      x-go-type-name: databaseEntities.DatabaseStatsOverview
      required:
        - id
        - dbName
        - size
        - tables
        - indexes
      properties:
        id:
          type: string
          example: 5
        dbName:
          type: string
          example: postgres
        size:
          type: object
          required:
            - sizeBytes
            - sizePretty
            - trend
          properties:
            sizeBytes:
              type: integer
              example: 10138083
            sizePretty:
              type: string
              example: 9.7 MB
            trend:
              type: object
              required:
                - value
                - diff
                - direction
              properties:
                value:
                  type: string
                  example: "+1.2 MB"
                diff:
                  type: integer
                  example: 8133
                direction:
                  $ref: "#/components/schemas/TrendDirection"
        tables:
          type: object
          required:
            - total
            - trend
          properties:
            total:
              type: integer
              example: 27
            trend:
              type: object
              required:
                - value
                - diff
                - direction
              properties:
                diff:
                  type: integer
                  example: 1
                value:
                  type: string
                  example: "+1"
                direction:
                  $ref: "#/components/schemas/TrendDirection"
        indexes:
          type: object
          required:
            - total
            - trend
          properties:
            total:
              type: integer
              example: 96
            trend:
              type: object
              required:
                - value
                - diff
                - direction
              properties:
                diff:
                  type: integer
                  example: 1
                value:
                  type: string
                  example: "-1"
                direction:
                  $ref: "#/components/schemas/TrendDirection"
    Database:
      type: object
      description: Represents database entity
      x-go-type: databaseEntities.Database
      x-go-type-import:
        path: dashboard/api/internal/model/database
        name: databaseEntities
      x-go-type-name: databaseEntities.Database
      required:
        - id
        - name
        - owner
        - encoding
        - ctype
        - connectionLimit
        - allowConnections
        - isTemplate
        - tablespace
        - sizeBytes
        - sizePretty
        - description
      properties:
        id:
          type: string
          description: This is essentially a Postgres OID.
          example: "1"
        name:
          type: string
          example: postgres
        owner:
          type: string
          example: postgres
        encoding:
          type: string
          example: UTF8
        ctype:
          type: string
          example: C
        connectionLimit:
          type: integer
          example: -1
        allowConnections:
          type: boolean
          example: true
        isTemplate:
          type: boolean
          example: false
        tablespace:
          type: string
          example: pg_default
        sizeBytes:
          type: integer
          example: 10138083
        sizePretty:
          type: string
          example: 9.7 MB
        description:
          type: string
          example: Description text if it exists
    DatabaseDetails:
      type: object
      description: Represents database entity from Postgres system catalog
      x-go-type: databaseEntities.DatabaseDetails
      x-go-type-import:
        path: dashboard/api/internal/model/database
        name: databaseEntities
      x-go-type-name: databaseEntities.DatabaseDetails
      required:
        - id
        - name
        - owner
        - encoding
        - collate
        - ctype
        - isTemplate
        - allowConnections
        - connectionLimit
        - sizeBytes
        - sizePretty
        - totalConnections
      properties:
        id:
          type: string
          description: This is essentially a Postgres OID.
          example: "1"
        name:
          type: string
          example: postgres
        owner:
          type: string
          example: postgres
        encoding:
          type: string
          example: UTF8
        collate:
          type: string
          example: en_US.UTF-8
        ctype:
          type: string
          example: en_US.UTF-8
        isTemplate:
          type: boolean
          example: false
        allowConnections:
          type: boolean
          example: true
        connectionLimit:
          type: integer
          example: -1
        sizeBytes:
          type: integer
          example: 7746019
        sizePretty:
          type: string
          example: "6.4 MB"
        totalConnections:
          type: integer
          example: 3
    GetStatusResponse:
      type: object
      required:
        - connectionStatus
      properties:
        connectionStatus:
          $ref: "#/components/schemas/ConnectionStatus"
        user:
          nullable: true
          type: string
          example: postgres
        database:
          nullable: true
          type: string
          example: postgres
    ClusterConnectData:
      x-go-type: clusterEntities.NewConnection
      x-go-type-import:
        path: dashboard/api/internal/model/cluster
        name: clusterEntities
      x-go-type-name: clusterEntities.NewConnection
      type: object
      required:
        - host
        - port
        - user
        - password
        - sslmode
      properties:
        host:
          type: string
          example: 127.0.0.1
        port:
          type: integer
          example: 5432
        user:
          type: string
          example: postgres
        password:
          type: string
          example: postgres
        database:
          type: string
          example: postgres
        sslmode:
          type: string
          example: ""
    GetPostgresVersionResponse:
      x-go-type: clusterEntities.PostgresVersion
      x-go-type-import:
        path: dashboard/api/internal/model/cluster
        name: clusterEntities
      x-go-type-name: clusterEntities.PostgresVersion
      type: object
      required:
        - version
        - compiler
        - bitDepth
      properties:
        version:
          type: string
          example: PostgreSQL 15.3 on x86_64-pc-linux-gnu
        compiler:
          type: string
          example: compiled by gcc (Ubuntu 11.3.0) 11.3.0
        bitDepth:
          type: string
          example: 64-bit
    GetPostgresUptimeResponse:
      x-go-type: clusterEntities.PostgresUptime
      x-go-type-import:
        path: dashboard/api/internal/model/cluster
        name: clusterEntities
      x-go-type-name: clusterEntities.PostgresUptime
      type: object
      description: Returns an ISO-8601 string with timezone
      required:
        - startedAt
      properties:
        startedAt:
          type: string
          example: 2025-12-05 13:45:06.746931+02
    GetPostgresPostmasterSettings:
      x-go-type: clusterEntities.PostmasterSettings
      x-go-type-import:
        path: dashboard/api/internal/model/cluster
        name: PostmasterSettings
      x-go-type-name: clusterEntities.PostmasterSettings
      type: object
      description: Represents some settings from pg_settings in the "postmaster" context.
      required:
        - configFile
        - dataDirectory
        - sharedBuffers
        - walBuffers
        - maxConnections
        - hbaFile
        - walLevel
        - autovacuumMaxWorkers
      properties:
        configFile:
          $ref: "#/components/schemas/PostgresSetting"
        dataDirectory:
          $ref: "#/components/schemas/PostgresSetting"
        sharedBuffers:
          $ref: "#/components/schemas/PostgresSetting"
        walBuffers:
          $ref: "#/components/schemas/PostgresSetting"
        maxConnections:
          $ref: "#/components/schemas/PostgresSetting"
        hbaFile:
          $ref: "#/components/schemas/PostgresSetting"
        walLevel:
          $ref: "#/components/schemas/PostgresSetting"
        autovacuumMaxWorkers:
          $ref: "#/components/schemas/PostgresSetting"
    RoleAccessLevel:
      type: string
      description: Admin > Elevated > Standard > Limited
      enum:
        - admin
        - elevated
        - standard
        - limited
      x-go-type: roleEntities.RoleAccessLevel
      x-go-type-import:
        path: dashboard/api/internal/model/role
        name: roleEntities
      x-go-type-name: roleEntities.RoleAccessLevel
    RoleAttributes:
      type: string
      description: https://www.postgresql.org/docs/current/role-attributes.html#ROLE-ATTRIBUTES
      enum:
        - superuser
        - login
        - createRole
        - createDatabase
        - replication
      x-go-type: roleEntities.RoleAttribute
      x-go-type-import:
        path: dashboard/api/internal/model/role
        name: roleEntities
      x-go-type-name: roleEntities.RoleAttribute
    RoleView:
      type: object
      required:
        - id
        - name
        - isGroup
        - accessLevel
        - membership
        - attributes
      x-go-type: roleEntities.RoleView
      x-go-type-import:
        path: dashboard/api/internal/model/role
        name: roleEntities
      x-go-type-name: roleEntities.RoleView
      properties:
        id:
          type: string
        name:
          type: string
        isGroup:
          type: boolean
        membership:
          type: array
          items:
            type: object
            required:
              - name
              - description
            properties:
              name:
                type: string
              description:
                type: string
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/RoleAttributes"
        accessLevel:
          $ref: "#/components/schemas/RoleAccessLevel"
